[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uznowcast"
version = "0.1.0"
description = "Registry-driven Uzbekistan macroeconomic data pilot"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "pyarrow", "openpyxl", "requests", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
